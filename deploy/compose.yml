name: gridzen-developer
services:
  developer:
    image: gridzen-developer:0.3.0
    ports: ['127.0.0.1:8030:8030']
    environment:
      GRIDZEN_MCP_EVENTS_DB: /metrics/counters.sqlite3
    volumes:
      - mcp-metrics:/metrics
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.35
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/health',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: '2'}
volumes:
  mcp-metrics:
    name: gridzen-mcp-metrics

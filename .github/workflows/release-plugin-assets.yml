name: Publish plugin release assets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-plugin-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/build_plugins.py
      - name: Attach validated plugins to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c "import tomllib; print('v'+tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          gh release view "$tag" >/dev/null
          gh release upload "$tag" dist/gridzen-verification-*.zip dist/plugin-sha256.json --clobber

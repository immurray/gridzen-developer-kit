name: Developer distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,server,mcp]' build twine jsonschema
      - run: python scripts/build_downloads.py && python scripts/build_plugins.py
      - run: python -m pytest -q tests
      - run: python scripts/check_mcp.py
      - run: python scripts/validate_distribution.py
      - run: python -m build && python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gridzen-distributions
          path: dist/

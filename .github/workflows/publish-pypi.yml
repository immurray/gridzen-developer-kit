name: Publish to PyPI (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' build twine jsonschema
      - run: python scripts/build_downloads.py && python scripts/build_plugins.py
      - run: python -m pytest -q tests && python scripts/check_mcp.py && python scripts/validate_distribution.py
      - run: python -m build --outdir python-dist && python -m twine check python-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: python-dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

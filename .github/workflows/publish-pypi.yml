name: Publish to PyPI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert not os.environ['GITHUB_REF'].startswith('refs/tags/') or os.environ['GITHUB_REF']=='refs/tags/v'+v"
      - run: python -m pip install '.[test]' build twine jsonschema
      - run: python scripts/build_downloads.py && python scripts/build_plugins.py
      - run: python -m pytest -q tests && python scripts/check_mcp.py && python scripts/validate_distribution.py
      - run: python -m build --outdir python-dist && python -m twine check python-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: python-dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/build_downloads.py && python scripts/build_plugins.py
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: python-dist/
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" python-dist/* src/gridzen_developer/web/downloads/*.zip src/gridzen_developer/web/downloads/sha256.json dist/plugins/*.zip dist/plugins/plugin-sha256.json --title "Gridzen Developer Kit $GITHUB_REF_NAME" --notes "Task-specific phone and personal identity planning; fixed-category remote attempt/error metrics; explicit opt-in feedback. Five MCP tools retained. Synthetic and conditional sandbox only; no live verification or billing enabled."

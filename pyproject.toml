"share/gridzen-developer-kit/skills/mexico-pilot-scoper/examples" = ["skills/mexico-pilot-scoper/examples/missing-evidence.json", "skills/mexico-pilot-scoper/examples/normal.json", "skills/mexico-pilot-scoper/examples/out-of-scope.json"]

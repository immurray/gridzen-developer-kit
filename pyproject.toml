[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gridzen-developer-kit"
version = "0.7.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Gridzen", email = "open@gridzen.ai"}]
keywords = ["mcp", "agent-skills", "identity-verification", "sandbox"]
description = "Single-task MCP profiles and Skills, offline utilities, research and explicit verification sandbox"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "httpx==0.28.1"]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
server = ["mcp==2.3.0", "fastapi==0.142.4", "uvicorn==0.54.0"]
test = ["pytest", "httpx", "mcp==2.3.0", "fastapi==0.142.4", "uvicorn==0.54.0"]

[project.scripts]
gridzen = "gridzen_developer.cli:main"
gridzen-mcp = "gridzen_developer.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridzen_developer = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.png", "data/LICENSE", "web/*.json"]

[project.urls]
Homepage = "https://gridzen.ai/developers/"
Documentation = "https://gridzen.ai/developers/quickstart.html"
Source = "https://github.com/immurray/gridzen-developer-kit"

[tool.setuptools.data-files]
"share/gridzen-developer-kit/skills/gridzen-explain-verification" = ["skills/gridzen-explain-verification/SKILL.md"]
